<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミリシタ 動き検討ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
  background: #f7f7f7;
  color: #444;
  padding: 28px 24px;
  min-height: 100dvh;
}
h1 {
  font-size: 19px;
  font-weight: 500;
  color: #4D4D4D;
  margin-bottom: 20px;
}
h1, .group-title { text-wrap: balance; }
.spec-body li, .placeholder, .field-error, .field-hint { text-wrap: pretty; }
.layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  max-width: 1100px;
}
/* ─── Left panel ─── */
.left {
  flex: 0 0 300px;
  min-width: 0;
}
.input-card {
  border: 1px solid #b9c7fb;
  border-radius: 6px;
  padding: 18px 16px;
  background: #fff;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  color: #4D4D4D;
  margin-bottom: 5px;
}
.field input {
  width: 100%;
  border: 1px solid #8a8a8a;
  border-radius: 4px;
  padding: 7px 10px;
  font-size: 14px;
  color: #1a1a1a;
  font-variant-numeric: tabular-nums;
}
.field input:focus { border-color: #3460FB; }
.field input[aria-invalid="true"] { border-color: #D42020; }
.field-error { font-size: 12px; font-weight: 600; color: #D42020; }
.field-error:not(:empty) { margin-top: 5px; }
/* CSV一括の入力欄。読めなかった行は1行ずつ改行して並べる */
.batch-card { margin-top: 16px; }
.field-hint { font-size: 12px; color: #767676; line-height: 1.6; margin-bottom: 6px; }
.field textarea {
  width: 100%;
  border: 1px solid #8a8a8a;
  border-radius: 4px;
  padding: 7px 10px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  color: #1a1a1a;
  font-variant-numeric: tabular-nums;
  resize: vertical;
}
.field textarea:focus { border-color: #3460FB; }
.field textarea[aria-invalid="true"] { border-color: #D42020; }
/* フォーカスは枠線の色と別の手段で示す（エラーの赤枠のままでも見える）*/
.field input:focus-visible, .field textarea:focus-visible { outline: 2px solid #3460FB; outline-offset: 1px; }
#inp-csv-error { white-space: pre-line; }
.btn-calc {
  width: 100%;
  padding: 9px;
  background: #3460FB;
  border: 1px solid #3460FB;
  border-radius: 4px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  margin-top: 2px;
}
.btn-calc:hover { background: #0017C1; border-color: #0017C1; }
.spec-toggle {
  display: inline-block;
  margin-top: 14px;
  font-size: 12px;
  color: #3460FB;
  cursor: pointer;
  user-select: none;
  text-decoration: underline;
  background: none;
  border: none;
  padding: 0;
}
.spec-toggle:hover { color: #0017C1; }
.spec-body {
  display: none;
  margin-top: 10px;
  font-size: 13px;
  color: #444;
  line-height: 1.7;
  border-top: 1px solid #e0e0e0;
  padding-top: 10px;
}
.spec-body.open { display: block; }
.spec-body li { margin-left: 12px; margin-bottom: 2px; }

/* ─── Right panel ─── */
.right {
  flex: 1;
  min-width: 0;
}
.placeholder {
  color: #6b6b6b;
  font-size: 13px;
  padding: 32px 0;
  text-align: center;
}
/* 画面には出さず読み上げだけに渡す（計算結果の短い要約）*/
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ─── Summary（スクロールしても指定のポイントが見えるよう上端に固定）─── */
.summary {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  margin-bottom: 18px;
  background: #f5f8ff;
  border: 1px solid #b9c7fb;
  border-radius: 5px;
  padding: 12px 16px;
  font-size: 13px;
  box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
}
.srow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 3px 0;
  color: #4D4D4D;
}
.srow + .srow { border-top: 1px solid #d6e0fb; }
.sval { color: #1a1a1a; font-variant-numeric: tabular-nums; }
.srow:first-child .sval { font-size: 17px; font-weight: 600; }
/* 表示するボーナス回数の切り替え（押されている側を塗る）*/
.seg { display: inline-flex; }
.seg-btn {
  min-width: 48px;
  padding: 3px 10px;
  background: #fff;
  border: 1px solid #3460FB;
  color: #0055AD;
  font-size: 12px;
  cursor: pointer;
}
.seg-btn + .seg-btn { border-left: none; }
.seg-btn:first-child { border-radius: 4px 0 0 4px; }
.seg-btn:last-child { border-radius: 0 4px 4px 0; }
.seg-btn:hover { background: #e8eeff; }
.seg-btn[aria-pressed="true"] { background: #3460FB; color: #fff; }

/* ─── Candidate groups ─── */
.group { margin-bottom: 18px; }
.group-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: #4D4D4D;
  margin-bottom: 8px;
}
.group-count { font-size: 12px; font-weight: 400; color: #6b6b6b; font-variant-numeric: tabular-nums; }
.group-empty { font-size: 13px; color: #6b6b6b; padding: 2px 0; }
/* 警告。.placeholder・.group-empty と同じ要素に付けるため、詳細度が同じそれらより後に書く */
.warn { color: #D42020; font-weight: 600; }
.result-row {
  display: flex;
  align-items: center;
  padding: 11px 16px;
  border: 1px solid #eee;
  border-radius: 5px;
  background: #fff;
  margin-bottom: 6px;
}
.cell {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 13px;
  color: #4D4D4D;
}
.cell-trig { justify-content: flex-end; }
.stage-badge {
  border: 1px solid #3460FB;
  border-radius: 3px;
  padding: 2px 9px;
  font-size: 12px;
  color: #0055AD;
  flex-shrink: 0;
}
.num { font-size: 14px; color: #1a1a1a; font-variant-numeric: tabular-nums; }
.rare-toggle { margin: 0 0 14px; }

/* ─── CSV一括の結果（1人1枠）─── */
.person { margin-bottom: 22px; }
.person-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 8px;
}
.person-name { min-width: 0; overflow-wrap: anywhere; }
.person-pt { font-size: 13px; font-weight: 400; color: #4D4D4D; font-variant-numeric: tabular-nums; }
.person .rare-toggle { margin: 2px 0 8px; }

@media (max-width: 620px) {
  .layout { flex-direction: column; }
  .left { flex: none; width: 100%; }
  .result-row { flex-wrap: wrap; row-gap: 8px; }
  .cell { flex: 1 1 45%; }
  .cell-trig { flex-basis: 100%; justify-content: flex-start; }
}
</style>
</head>
<body>

<h1>ミリシタ 動き検討ツール</h1>

<div class="layout">
  <div class="left">
    <form class="input-card" id="calc-form" novalidate>
      <div class="field">
        <label for="inp-pt">指定のポイント</label>
        <input type="text" id="inp-pt" value="0" inputmode="numeric" autocomplete="off" aria-describedby="inp-pt-error">
        <p class="field-error" id="inp-pt-error" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn-calc" id="btn-calc">計算する</button>
      <button type="button" class="spec-toggle" id="spec-toggle" aria-expanded="false" aria-controls="spec-body"><span aria-hidden="true">◇</span> <span id="spec-toggle-label">仕様を表示</span></button>
      <ul class="spec-body" id="spec-body"></ul>
    </form>
    <form class="input-card batch-card" id="batch-form" novalidate>
      <div class="field">
        <label for="inp-csv">CSVでまとめて計算</label>
        <p class="field-hint" id="inp-csv-hint"></p>
        <textarea id="inp-csv" rows="8" spellcheck="false" aria-describedby="inp-csv-hint inp-csv-error" placeholder="プレイヤーA,4605373&#10;プレイヤーB,4,560,338pt"></textarea>
        <p class="field-error" id="inp-csv-error" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn-calc" id="btn-batch">まとめて計算する</button>
    </form>
  </div>

  <div class="right">
    <div id="result">
      <div class="placeholder">「計算する」を押すと結果が表示されます</div>
    </div>
    <p id="result-status" class="visually-hidden" role="status"></p>
  </div>
</div>

<script>
// ── 動きの定義（ポイント・トリガー数の正本。仕様の文言もここから組む）──
const CHARGE  = { name: '貯め',     point: 595,  trigger: 595 };
const RELEASE = { name: '吐き',     point: 634,  trigger: -180 };
const BONUS   = { name: 'ボーナス', point: 3000, max: 5 };
const TRIGGER_MIN  = -10000;                 // トリガー数はこれを下回らない
const TRIGGER_MAX  = 999999;                 // ゲーム内のトリガー数の上限（6桁）
const LIKELY_BONUS = [0, BONUS.max];         // ボーナス回数はほとんどがこのどちらか
const RARE_BONUS   = Array.from({ length: BONUS.max + 1 }, (_, c) => c).filter(c => !LIKELY_BONUS.includes(c));
const UNLIKELY_RELEASE = 1000;               // 吐きが4桁（この回数以上）で
const UNLIKELY_TRIGGER = 500000;             // 最後のトリガー数がこの数以上の組はほとんど起きない
const BONUS_ORDER  = [...LIKELY_BONUS, ...RARE_BONUS];   // 候補を並べるボーナス回数の順
const MAX_PT       = 99999999;               // 指定ポイントの入力上限（8桁）
const BATCH_MAX    = 50;                     // CSVで一度に計算する人数の上限（運用は1時間帯あたり5〜15人）

const bonusLabel = cs => cs.length > 1 && cs.at(-1) - cs[0] === cs.length - 1
  ? `${cs[0]}〜${cs.at(-1)}回`
  : cs.map(c => `${c}回`).join('・');
const LIKELY_LABEL = bonusLabel(LIKELY_BONUS);   // 0回・5回
const RARE_LABEL   = bonusLabel(RARE_BONUS);     // 1〜4回

const SPEC_ITEMS = [
  `${CHARGE.name}: ${CHARGE.point.toLocaleString()}ptとトリガー${CHARGE.trigger.toLocaleString()}個を得ます。`,
  `${RELEASE.name}: トリガー${(-RELEASE.trigger).toLocaleString()}個を使い、${RELEASE.point.toLocaleString()}ptを得ます。`,
  `${BONUS.name}: ${BONUS.point.toLocaleString()}ptを得ます。使えるのは最大${BONUS.max}回です。`,
  `トリガー数は0個から数えます。最後のトリガー数が${TRIGGER_MIN.toLocaleString()}〜${TRIGGER_MAX.toLocaleString()}個に収まらない組み合わせは候補に含めません。`,
  `${BONUS.name}は${LIKELY_LABEL}のことがほとんどのため、${RARE_LABEL}の候補は「その他の候補」に分けます。`,
  `${RELEASE.name}が${UNLIKELY_RELEASE.toLocaleString()}回以上で、最後のトリガー数が${UNLIKELY_TRIGGER.toLocaleString()}個以上の組み合わせも、ほとんど起きないため「その他の候補」に分けます。`,
  `同じ${BONUS.name}回数の候補は、最後のトリガー数が0に近い順に並べます。`,
];

const CSV_HINT = `1行に1人分を「名前,現在pt」の形で書きます。区切りはカンマかタブです。`
  + `ptの桁区切りのカンマと末尾の「pt」はそのままで構いません。1行目が見出し（数字が無く「pt」か「ポイント」を含む）なら読み飛ばします。`
  + `一度に${BATCH_MAX}人まで計算できます。`;

// HTML特殊文字エスケープ（innerHTML描画の防御）
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString();
const signed = n => (n > 0 ? '+' : '') + fmt(n);

// pt = 貯め×595 + 吐き×634 + ボーナス×3000 を満たす回数の組をすべて返す。
// ボーナス回数と吐き回数を決めると貯め回数が決まるため、その2つを走査する。
// 最後のトリガー数が範囲内なら、途中も範囲内に収まる順序がある。下限に届くまで吐きを打ち、
// 届いたら貯めを1回挟む。吐きが尽きたら残りの貯めを打つ。途中の最大は0か最後の値で、最小は下限以上。
// そのため判定は最後のトリガー数だけで行う。
// 残り rest − 吐き×634 が595で割り切れる吐き回数は、595 / gcd(634, 595) 回ごとに現れる。
// 最初の1回を1周期の中で探し、以降はその刻みで進める（1刻みで回すと、MAX_PT で1件約95万回になる）
const gcd = (x, y) => (y === 0 ? x : gcd(y, x % y));
const RELEASE_STEP = CHARGE.point / gcd(RELEASE.point, CHARGE.point);
function solve(pt) {
  const list = [];
  for (let c = 0; c <= BONUS.max; c++) {
    const rest = pt - BONUS.point * c;
    let first = 0;
    while (first < RELEASE_STEP && (rest - RELEASE.point * first) % CHARGE.point !== 0) first++;
    if (first === RELEASE_STEP) continue;   // 1周期で割り切れなければ、この回数の組は無い
    for (let b = first; RELEASE.point * b <= rest; b += RELEASE_STEP) {
      const r = rest - RELEASE.point * b;
      if (r % CHARGE.point !== 0) continue;
      const a = r / CHARGE.point;
      const trigger = CHARGE.trigger * a + RELEASE.trigger * b;
      if (trigger >= TRIGGER_MIN && trigger <= TRIGGER_MAX) list.push({ charge: a, release: b, bonus: c, trigger });
    }
  }
  return list;
}

// トリガー数が0に近い順。同点の並べ方は決めない。現在の定数では、同じボーナス回数の候補どうしの
// トリガー数の差が 484,330 の倍数になる。絶対値が等しい2件があれば負の側は −242,165 以下で、下限で除外済み
const byTrigger = (x, y) => Math.abs(x.trigger) - Math.abs(y.trigger);

// 主な候補か（ボーナスが0回・5回で、吐き4桁かつトリガー数50万以上の組でない）。それ以外は「その他の候補」
const isLikely = x => LIKELY_BONUS.includes(x.bonus)
  && !(x.release >= UNLIKELY_RELEASE && x.trigger >= UNLIKELY_TRIGGER);

// 表示するボーナス回数の切り替え。'all' は0回・5回の両方。1〜4回は切り替えによらず表示する
const BONUS_VIEWS = ['all', ...LIKELY_BONUS.map(String)];
const viewLabel = v => (v === 'all' ? '両方' : `${v}回`);
const shownBonus = view => BONUS_ORDER.filter(c => view === 'all' || String(c) === view || !LIKELY_BONUS.includes(c));

// 1人分の候補のうち、ボーナス回数が bonus で主な候補か（keep）が一致するものを、トリガー数が0に近い順で返す。
// 1人用と CSV 一括の両方がこれで分ける（片側だけ分け方が変わらないように）
const candidates = (list, bonus, keep) => list.filter(x => x.bonus === bonus && isLikely(x) === keep).sort(byTrigger);
// 主な候補が無いときだけ、別枠の候補を最初から開く
const initialRareOpen = list => !list.some(isLikely);

// ptの文字列を { pt, digits } か { reason } にする。全角は半角へ寄せ、前後の空白と末尾の pt を除く。
// 受け付けるのは数字だけか、3桁ごとにカンマか空白で区切った数字（区切りの混在は不可）。0以上の整数に限る（小数・指数表記・負は不可）
const PT_FORMAT = /^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/;
function parsePt(text) {
  const digits = String(text).normalize('NFKC').trim().replace(/\s*pt$/i, '');
  if (!PT_FORMAT.test(digits))
    return { reason: /\d/.test(digits) && /^[\d, ]+$/.test(digits) ? '桁区切りは3桁ごとにしてください' : 'ポイントが0以上の整数ではありません' };
  const pt = Number(digits.replace(/[, ]/g, ''));
  if (pt > MAX_PT) return { reason: `ポイントは${MAX_PT.toLocaleString()}以下にしてください` };
  return { pt, digits };
}

// 貼り付けたCSVを人ごとの { line, name, pt } と、読めなかった行 { line, raw, reason } に分ける。
// 名前は最初の区切りより前（名前にカンマを含む行は正しく読めない）。ptは parsePt で読む。
// 区切りがカンマで、名前が数字で終わり pt が3桁区切りで始まる行（プレイヤーA 4,605,373）は、境目が読めないためエラー
function parseCsv(text) {
  const people = [], errors = [];
  let first = true;
  String(text).split(/\r\n|\r|\n/).forEach((raw, i) => {
    const s = raw.trim();   // trim は先頭の BOM（U+FEFF）も除く
    if (!s) return;
    const isFirst = first;
    first = false;
    const line = i + 1;
    const fail = reason => { errors.push({ line, raw: s, reason }); };
    const sep = s.search(/[,，\t]/);
    if (sep < 0) return fail('区切り（カンマかタブ）がありません');
    const name = s.slice(0, sep).trim();
    const rest = s.slice(sep + 1);
    // 見出し行。数字が無いだけでは見出しとしない（1行目のデータの誤記を黙って読み飛ばさない）
    if (isFirst && !/\d/.test(rest.normalize('NFKC')) && /pt|ポイント/i.test(rest.normalize('NFKC'))) return;
    if (!name) return fail('名前がありません');
    if (rest.includes('\t')) return fail('列が多すぎます（区切りは名前とポイントの間の1か所だけにしてください）');
    const r = parsePt(rest);
    if (r.reason) return fail(r.reason);
    if (s[sep] !== '\t' && /(?:^|\s)\d{1,3}$/.test(name.normalize('NFKC')) && /^\d{3}(?:[, ]|$)/.test(r.digits))
      return fail('名前の末尾の数字がポイントの一部かもしれません。名前とポイントの間にカンマかタブを入れてください');
    people.push({ line, name, pt: r.pt });
  });
  return { people, errors };
}

// 20文字はコードポイントで数える（UTF-16 の単位で切ると絵文字のサロゲートペアが割れる）
const shorten = s => { const cs = [...s]; return cs.length > 20 ? `${cs.slice(0, 20).join('')}…` : s; };

// CSV一括のエラーは、読めなかった行（batchRowErrors: { line, raw, reason } の配列）と入力全体のエラー（batchError: 文字列）に分ける
const appState = {
  pt: 0, list: null, error: '', rareOpen: false, mode: 'single', batch: null, batchRowErrors: [], batchError: '', bonusView: 'all',
};

// CSV一括の ViewModel。人ごとに主な候補・その他の候補を、ボーナス回数の並び→トリガー数が0に近い順で並べる。
// 読めなかった行は行番号つきの文字列にする（errors）。入力全体のエラーは message
function buildBatchViewModel(state) {
  const shown = shownBonus(state.bonusView);
  const people = (state.batch || []).map((p, index) => {
    const pick = keep => shown.flatMap(c => candidates(p.list, c, keep));
    return { index, name: p.name, pt: p.pt, total: p.list.length, likely: pick(true), rare: pick(false), rareOpen: p.rareOpen };
  });
  const errors = state.batchRowErrors.map(e => `${e.line}行目「${shorten(e.raw)}」: ${e.reason}`);
  return { kind: 'batch', people, errors, message: state.batchError, bonusView: state.bonusView };
}

// ViewModel（純粋関数。appStateを直読みせず引数で受け取る）
// 1グループの候補は最大3件（トリガー数の範囲の幅が、候補どうしの差 484,330 の2倍強のため）。全件を表示する
// その他の候補のグループは、1〜4回は0件でも出し、0回・5回は候補がある回数だけ出す
function buildViewModel(state) {
  if (state.mode === 'batch') return buildBatchViewModel(state);
  if (state.error) return { kind: 'error', message: state.error };
  if (!state.list) return { kind: 'idle' };
  if (state.list.length === 0) return { kind: 'none' };
  const shown = shownBonus(state.bonusView);
  const toGroup = keep => c => ({ bonus: c, items: candidates(state.list, c, keep) });
  const likely = shown.filter(c => LIKELY_BONUS.includes(c)).map(toGroup(true));
  const rare   = shown.map(toGroup(false)).filter(g => g.items.length > 0 || RARE_BONUS.includes(g.bonus));
  const count  = gs => gs.reduce((n, g) => n + g.items.length, 0);
  return {
    kind: 'list', pt: state.pt, likely, rare, likelyCount: count(likely), rareCount: count(rare),
    rareOpen: state.rareOpen, bonusView: state.bonusView,
  };
}

// 開閉ボタンの先頭の記号。読み上げ設定によっては記号名で読まれるため、読み上げから外す
const MARK = '<span aria-hidden="true">◇</span>';

// 候補1件の行。CSV一括ではボーナス回数のセルを先頭に足す
const _countCell = (name, n) => `<span class="cell"><span class="stage-badge">${esc(name)}</span><span><span class="num">${fmt(n)}</span>回</span></span>`;
const _rowHtml = (x, withBonus = false) => `<div class="result-row">
      ${withBonus ? _countCell(BONUS.name, x.bonus) : ''}${_countCell(CHARGE.name, x.charge)}
      ${_countCell(RELEASE.name, x.release)}
      <span class="cell cell-trig">トリガー数<span class="num">${signed(x.trigger)}</span></span>
    </div>`;

function _groupHtml(g) {
  const head = `<h2 class="group-title">${esc(BONUS.name)} ${g.bonus}回<span class="group-count">${g.items.length}件</span></h2>`;
  if (g.items.length === 0) return `<section class="group">${head}<div class="group-empty">該当なし</div></section>`;
  const rows = g.items.map(x => _rowHtml(x)).join('');
  return `<section class="group">${head}${rows}</section>`;
}

// サマリの中に置く、表示するボーナス回数の切り替え（上端に固定されるため、スクロール中も切り替えられる）
function _viewRowHtml(view) {
  const btns = BONUS_VIEWS.map(v =>
    `<button type="button" class="seg-btn" data-action="bonus-view" data-view="${v}" aria-pressed="${v === view}">${viewLabel(v)}</button>`).join('');
  return `<div class="srow"><span>表示する${esc(BONUS.name)}回数</span><span class="seg" role="group" aria-label="表示する${esc(BONUS.name)}回数">${btns}</span></div>`;
}

function _personHtml(p) {
  const head = `<h2 class="person-title"><span class="person-name">${esc(p.name)}</span><span class="person-pt"><span class="num">${fmt(p.pt)}</span>pt</span></h2>`;
  if (p.total === 0)
    return `<section class="person">${head}<div class="group-empty warn">合う組み合わせがありません</div></section>`;
  const likely = p.likely.length
    ? p.likely.map(x => _rowHtml(x, true)).join('')
    : '<div class="group-empty">主な候補はありません</div>';
  if (p.rare.length === 0) return `<section class="person">${head}${likely}</section>`;
  const toggle = `<button type="button" class="spec-toggle rare-toggle" data-action="rare-person" data-index="${p.index}" aria-expanded="${p.rareOpen}">${MARK} その他の候補（${p.rare.length}件）を${p.rareOpen ? '隠す' : '表示'}</button>`;
  const rare = p.rareOpen ? p.rare.map(x => _rowHtml(x, true)).join('') : '';
  return `<section class="person">${head}${likely}${toggle}${rare}</section>`;
}

// 読めなかった行の一覧は入力欄の直下に出す（_renderFieldError）。計算できた人が0人なら結果欄は空
function _batchHtml(vm) {
  if (vm.people.length === 0) return '';
  const summary = `<div class="summary">
    <div class="srow"><span>計算した人数</span><span class="sval">${vm.people.length}人</span></div>
    <div class="srow"><span>読めなかった行</span><span class="sval">${vm.errors.length}行</span></div>
    ${_viewRowHtml(vm.bonusView)}
  </div>`;
  return summary + vm.people.map(_personHtml).join('');
}

function _resultHtml(vm) {
  if (vm.kind === 'batch') return _batchHtml(vm);
  if (vm.kind === 'idle')  return '<div class="placeholder">「計算する」を押すと結果が表示されます</div>';
  if (vm.kind === 'error') return '';   // 入力のエラーは入力欄の直下に出す（_renderFieldError）
  if (vm.kind === 'none')  return '<div class="placeholder warn">指定のポイントに合う組み合わせがありません。入力したポイントを確かめてください</div>';

  const summary = `<div class="summary">
    <div class="srow"><span>指定のポイント</span><span class="sval">${fmt(vm.pt)}</span></div>
    <div class="srow"><span>主な候補</span><span class="sval">${vm.likelyCount}件</span></div>
    <div class="srow"><span>その他の候補</span><span class="sval">${vm.rareCount}件</span></div>
    ${_viewRowHtml(vm.bonusView)}
  </div>`;
  const likely = vm.likely.map(_groupHtml).join('');
  if (vm.rareCount === 0) return summary + likely;
  const toggle = `<button type="button" class="spec-toggle rare-toggle" data-action="rare" aria-expanded="${vm.rareOpen}">${MARK} その他の候補を${vm.rareOpen ? '隠す' : '表示'}</button>`;
  const rare = vm.rareOpen ? vm.rare.map(_groupHtml).join('') : '';
  return summary + likely + toggle + rare;
}

// エラーは計算した側の入力欄にだけ出し、もう一方の入力欄のエラーは消す
// 同じ文言のままでは読み上げられないため、いったん空にして次のフレームで入れ直す。
// 入れ直しを待つ間に次の set が来たら、古い入れ直しは何も書かない（欄ごとの通し番号で判定する）
const _errorSeq = {};
function _renderFieldError(vm) {
  const set = (id, message) => {
    const box = document.getElementById(`${id}-error`);
    const seq = _errorSeq[id] = (_errorSeq[id] || 0) + 1;
    if (message && box.textContent === message) {
      box.textContent = '';
      requestAnimationFrame(() => { if (_errorSeq[id] === seq) box.textContent = message; });
    } else {
      box.textContent = message;
    }
    document.getElementById(id).setAttribute('aria-invalid', message ? 'true' : 'false');
  };
  set('inp-pt', vm.kind === 'error' ? vm.message : '');
  set('inp-csv', vm.kind === 'batch' ? [vm.message, ...vm.errors].filter(Boolean).join('\n') : '');
}

// 計算したときに読み上げる短い要約。結果欄の全体（全員の名前・全候補）は読み上げない。
// 入力のエラーは入力欄のエラー欄が知らせるため空にする
function statusText(vm) {
  if (vm.kind === 'list')  return `主な候補${vm.likelyCount}件、その他の候補${vm.rareCount}件を計算しました`;
  if (vm.kind === 'none')  return '指定のポイントに合う組み合わせがありません';
  if (vm.kind === 'batch' && vm.people.length > 0) return `${vm.people.length}人を計算しました。読めなかった行 ${vm.errors.length}行`;
  return '';
}
const announce = vm => { document.getElementById('result-status').textContent = statusText(vm); };

function renderAll() {
  const vm = buildViewModel(appState);
  document.getElementById('result').innerHTML = _resultHtml(vm);
  _renderFieldError(vm);
  return vm;
}

// 指定のポイントは CSV の pt 欄と同じ書式で読む（parsePt）。読めない値はエラーを出して計算しない
function doCalc() {
  const value = document.getElementById('inp-pt').value;
  const r = value.trim() ? parsePt(value) : { reason: 'ポイントを入力してください' };
  appState.mode     = 'single';
  if (r.reason) {
    appState.list  = null;
    appState.error = r.reason;
    return renderAll();
  }
  appState.pt       = r.pt;
  appState.error    = '';
  appState.list     = solve(appState.pt);
  appState.rareOpen = initialRareOpen(appState.list);
  return renderAll();
}

// 読めなかった行があっても、読めた行は計算する。人数の上限を超えたら誰も計算しない
function doBatch() {
  const { people, errors } = parseCsv(document.getElementById('inp-csv').value);
  appState.mode = 'batch';
  appState.batch = null;
  appState.batchRowErrors = [];
  appState.batchError = '';
  if (people.length + errors.length === 0) {
    appState.batchError = '名前と現在ptを1行以上入力してください';
  } else if (people.length > BATCH_MAX) {
    appState.batchError = `一度に計算できるのは${BATCH_MAX}人までです（${people.length}人分あります）`;
  } else {
    appState.batch = people.map(p => {
      const list = solve(p.pt);
      return { ...p, list, rareOpen: initialRareOpen(list) };
    });
    appState.batchRowErrors = errors;
  }
  return renderAll();
}

document.getElementById('spec-body').innerHTML = SPEC_ITEMS.map(s => `<li>${esc(s)}</li>`).join('');
document.getElementById('inp-csv-hint').textContent = CSV_HINT;

document.getElementById('result').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  // 開閉は表示中のモードのボタンだけが変える（別のモードの状態を残したまま描き直さない）
  if (btn.dataset.action === 'rare' && appState.mode === 'single') appState.rareOpen = !appState.rareOpen;
  // 表示の切り替えは再計算しても保つ。決まった値以外は無視する
  if (btn.dataset.action === 'bonus-view' && BONUS_VIEWS.includes(btn.dataset.view)) appState.bonusView = btn.dataset.view;
  if (btn.dataset.action === 'rare-person' && appState.mode === 'batch') {
    // Number('') は 0 になるため、数字だけの index に限る
    const p = /^\d+$/.test(btn.dataset.index || '') ? (appState.batch || [])[Number(btn.dataset.index)] : null;
    if (p) p.rareOpen = !p.rareOpen;
  }
  renderAll();
  // 描画し直すと押したボタンが DOM から外れフォーカスを失うため、同じボタンへ戻す。
  // セレクタは検証済みの値からだけ組む（見つからなければ何もしない）
  const d = btn.dataset;
  let sel = null;
  if (d.action === 'rare') sel = '[data-action="rare"]';
  else if (d.action === 'rare-person' && /^\d+$/.test(d.index || '')) sel = `[data-action="rare-person"][data-index="${d.index}"]`;
  else if (d.action === 'bonus-view' && BONUS_VIEWS.includes(d.view)) sel = `[data-action="bonus-view"][data-view="${d.view}"]`;
  const next = sel && document.getElementById('result').querySelector(sel);
  if (next) next.focus();
});

document.getElementById('batch-form').addEventListener('submit', e => {
  e.preventDefault();
  announce(doBatch());
});

// 入力欄での Enter はフォームの標準動作で submit になる。送信先は無いため既定動作は止める
document.getElementById('calc-form').addEventListener('submit', e => {
  e.preventDefault();
  announce(doCalc());
});
document.getElementById('spec-toggle').addEventListener('click', () => {
  const body = document.getElementById('spec-body');
  const btn  = document.getElementById('spec-toggle');
  body.classList.toggle('open');
  const open = body.classList.contains('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.getElementById('spec-toggle-label').textContent = open ? '仕様を隠す' : '仕様を表示';
});
</script>
</body>
</html>
